<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>智慧護理 | Điều dưỡng thông minh — 臺北市立聯合醫院仁愛院區</title>

<!-- ══════════════════════════════════════════════════════════════════
     簡報播放器   © 鄭瑞賢 製作・版權所有
     要改的東西只有檔案下半部 JS 區塊最上面的 CONFIG 與 SLIDES 兩塊。
     ══════════════════════════════════════════════════════════════ -->

<style>
:root{
  --teal:#2f9e8f;
  --teal-dim:#1f6f65;
  --coral:#ef6b72;
  --stage:#0e1a18;
  --bar:rgba(9,20,18,.86);
  --ink:#e8f3f1;
  --ink-dim:#8fa8a3;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--stage)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",
              "Microsoft JhengHei",sans-serif;
  color:var(--ink);
}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
[v-cloak]{opacity:0}

/* ── 舞台 ───────────────────────────────────────────── */
.stage{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(120% 90% at 50% 0%,#152926 0%,var(--stage) 62%);
  touch-action:pan-y pinch-zoom;
  user-select:none;-webkit-user-select:none;
}
.stage img{
  max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain;display:block;
  transition:opacity .18s ease;
}
.stage img.loading{opacity:0}

.spinner{
  position:absolute;width:38px;height:38px;border-radius:50%;
  border:3px solid rgba(47,158,143,.25);border-top-color:var(--teal);
  animation:spin .8s linear infinite;pointer-events:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

.slow{
  position:absolute;top:calc(50% + 40px);font-size:12px;color:var(--ink-dim);
  text-align:center;line-height:1.7;padding:0 24px;pointer-events:none;
}

/* ── 載入失敗 ────────────────────────────────────────── */
.err{
  position:absolute;max-width:min(560px,86vw);padding:22px 24px;
  background:rgba(20,36,33,.94);border:1px solid rgba(239,107,114,.4);
  border-radius:14px;text-align:center;
}
.err h3{font-size:14px;color:var(--coral);margin-bottom:10px;letter-spacing:.3px}
.err code{
  display:block;font-size:11px;color:var(--ink-dim);word-break:break-all;
  background:rgba(0,0,0,.3);padding:9px 11px;border-radius:7px;margin-bottom:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.6;text-align:left;
}
.err p{font-size:12px;color:var(--ink-dim);line-height:1.7;margin-bottom:14px}
.err button{
  border:0;background:var(--teal);color:#06211d;font-weight:700;font-size:13px;
  padding:10px 22px;border-radius:999px;cursor:pointer;font-family:inherit;
}
.err button:active{background:#258a7c}

/* ── 點擊區（左三分之一上一頁 / 右三分之一下一頁 / 中間切控制列）── */
.zones{position:absolute;inset:0;display:flex}
.zones>div{flex:1}
.zones>div:nth-child(2){flex:1.1}

/* ── 控制列 ──────────────────────────────────────────── */
.bar{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  padding:10px calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(to top,var(--bar) 55%,rgba(9,20,18,0));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:opacity .25s ease,transform .25s ease;
}
.bar.hide{opacity:0;transform:translateY(12px);pointer-events:none}

.btn{
  flex:none;display:grid;place-items:center;
  width:42px;height:42px;border:0;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.07);color:var(--ink);
  font-size:17px;line-height:1;
  transition:background .15s ease;
}
.btn:hover{background:rgba(47,158,143,.3)}
.btn:active{background:var(--teal)}
.btn:disabled{opacity:.28;cursor:default;background:rgba(255,255,255,.05)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
         stroke-linecap:round;stroke-linejoin:round}

.meta{flex:1;min-width:0;padding:0 2px}
.meta .t{
  font-size:13px;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta .c{font-size:11px;color:var(--ink-dim);margin-top:2px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{
  flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-dim);
  padding:0 2px;
}
.count b{color:var(--ink);font-size:15px;font-weight:700}

/* ── 進度條 ──────────────────────────────────────────── */
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:30;
      background:rgba(255,255,255,.08);pointer-events:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#5fd3bf);
        transition:width .25s ease}

/* ── 版權 ────────────────────────────────────────────── */
.copy{
  position:absolute;z-index:19;
  left:calc(12px + var(--sal));top:calc(10px + var(--sat));
  font-size:10px;letter-spacing:.3px;color:rgba(232,243,241,.42);
  pointer-events:none;transition:opacity .25s ease;
}
.copy.hide{opacity:0}

/* ── 縮圖總覽 ────────────────────────────────────────── */
.grid-wrap{
  position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  background:rgba(8,18,16,.97);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.grid-head{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(12px + var(--sat)) calc(14px + var(--sar)) 12px calc(14px + var(--sal));
  border-bottom:1px solid rgba(255,255,255,.07);
}
.grid-head h2{font-size:15px;font-weight:700;flex:1;letter-spacing:.3px}
.grid-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px calc(12px + var(--sar)) calc(24px + var(--sab)) calc(12px + var(--sal));
}
.ch-title{
  display:flex;align-items:center;gap:9px;
  margin:18px 2px 10px;font-size:12px;font-weight:700;color:var(--teal);
  letter-spacing:1px;
}
.ch-title::after{content:"";flex:1;height:1px;background:rgba(47,158,143,.22)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cell{
  position:relative;border:0;padding:0;cursor:pointer;border-radius:9px;overflow:hidden;
  background:#162623;aspect-ratio:16/9;
  outline:2px solid transparent;outline-offset:1px;transition:outline-color .15s ease;
}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .no{
  position:absolute;left:0;top:0;
  background:rgba(9,20,18,.82);color:var(--ink);
  font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:3px 7px;border-bottom-right-radius:8px;letter-spacing:.5px;
}
.cell.on{outline-color:var(--coral)}
.cell.on .no{background:var(--coral)}

/* ── 直式提示 ────────────────────────────────────────── */
.rotate{
  position:absolute;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:28px;text-align:center;background:var(--stage);
}
.rotate .ico{
  width:62px;height:62px;color:var(--teal);
  animation:tilt 2.2s ease-in-out infinite;
}
.rotate .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;
                 stroke-linecap:round;stroke-linejoin:round}
@keyframes tilt{0%,45%{transform:rotate(0)}60%,90%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
.rotate p{font-size:15px;font-weight:600;line-height:1.6}
.rotate p span{display:block;font-size:12.5px;font-weight:500;color:var(--teal);margin-top:4px}
.rotate button{
  margin-top:4px;border:1px solid rgba(255,255,255,.16);background:transparent;
  color:var(--ink-dim);font-size:12px;padding:9px 18px;border-radius:999px;cursor:pointer;
  font-family:inherit;
}
.rotate button:active{background:rgba(255,255,255,.06)}

.fade-enter-active,.fade-leave-active{transition:opacity .18s ease}
.fade-enter-from,.fade-leave-to{opacity:0}

@media (max-width:420px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
  .meta .t{font-size:12px}
}
</style>
</head>

<body>
<div id="app" v-cloak>

  <!-- 舞台 -->
  <div class="stage"
       @touchstart.passive="tStart" @touchend.passive="tEnd"
       @mousemove="wake">
    <div class="spinner" v-if="state==='loading'"></div>
    <div class="slow" v-if="state==='loading' && slow">
      圖片載入中，比預期久<br>Đang tải ảnh…
    </div>

    <img :src="imgUrl" :alt="cur.title" :class="{loading:state!=='ok'}"
         @load="onLoad" @error="onErr" draggable="false">

    <div class="err" v-if="state==='error'">
      <h3>這一頁的圖片讀不到</h3>
      <code>{{ imgUrl }}</code>
      <p>
        檢查 <b>slides/</b> 資料夾裡有沒有 <b>{{ cur.file }}{{ ext }}</b>，
        以及大小寫是否一致（GitHub Pages 有分大小寫）。
      </p>
      <button @click="retry">重試</button>
    </div>

    <div class="zones">
      <div @click="prev"></div>
      <div @click="toggleBar"></div>
      <div @click="next"></div>
    </div>
  </div>

  <div class="copy" :class="{hide:!barOn}">© 鄭瑞賢 製作・版權所有</div>

  <!-- 控制列 -->
  <div class="bar" :class="{hide:!barOn}">
    <button class="btn" @click="prev" :disabled="i===0" aria-label="上一頁">
      <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <button class="btn" @click="next" :disabled="i===slides.length-1" aria-label="下一頁">
      <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
    </button>
    <div class="meta">
      <div class="t">{{ cur.title }}</div>
      <div class="c" v-if="cur.ch">{{ cur.ch }}</div>
    </div>
    <div class="count"><b>{{ i+1 }}</b> / {{ slides.length }}</div>
    <button class="btn" @click="grid=true" aria-label="縮圖總覽">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg>
    </button>
    <button class="btn" v-if="fsOK" @click="fullscreen" aria-label="全螢幕">
      <svg v-if="!isFs" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg v-else viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </div>

  <div class="prog"><i :style="{width:((i+1)/slides.length*100)+'%'}"></i></div>

  <!-- 縮圖總覽 -->
  <transition name="fade">
  <div class="grid-wrap" v-if="grid">
    <div class="grid-head">
      <h2>目錄　Mục lục</h2>
      <button class="btn" @click="grid=false" aria-label="關閉">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="grid-body" ref="gb">
      <template v-for="g in groups" :key="g.ch || 'x'">
        <div class="ch-title" v-if="g.ch">{{ g.ch }}</div>
        <div class="grid">
          <button class="cell" v-for="s in g.items" :key="s.file"
                  :class="{on:s.idx===i}" :ref="el=>{ if(s.idx===i) curCell=el }"
                  @click="go(s.idx); grid=false">
            <img :src="thumb(s)" :alt="s.title" loading="lazy" decoding="async"
                 @error="thumbFail($event,s)">
            <span class="no">{{ s.idx+1 }}</span>
          </button>
        </div>
      </template>
    </div>
  </div>
  </transition>

  <!-- 直式提示 -->
  <div class="rotate" v-if="portrait && !ignorePortrait">
    <div class="ico"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.2"/><path d="M10.6 18.6h2.8"/></svg></div>
    <p>請將手機轉為橫向觀看<span>Vui lòng xoay ngang điện thoại</span></p>
    <button @click="ignorePortrait=true">仍要直式瀏覽</button>
  </div>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   ① CONFIG — 圖檔放在哪、副檔名是什麼
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  dir       : 'slides/',   // 圖片資料夾（結尾要有斜線）
  ext       : '.jpg',      // 副檔名
  thumbPre  : 't',         // 縮圖前綴：slides/t01.jpg
                           //   → 沒有縮圖檔也沒關係，會自動改用原圖
  autoHideMs: 3000         // 控制列幾毫秒後自動淡出；設 0 = 不自動隱藏
};

/* ═══════════════════════════════════════════════════════════════════
   ② SLIDES — 播放順序。要增刪頁只要動這個陣列。
      file  = 檔名（不含副檔名），ch = 章節（縮圖總覽分組用），title = 頁名
   ═══════════════════════════════════════════════════════════════ */
const SLIDES = [

  { file:'00', ch:'',                title:'封面｜智慧護理' },

  { file:'01', ch:'壹、智慧病房',    title:'電子床頭卡' },
  { file:'02', ch:'壹、智慧病房',    title:'智慧電視｜燈光與窗簾控制' },
  { file:'03', ch:'壹、智慧病房',    title:'智慧電視｜環境介紹' },
  { file:'04', ch:'壹、智慧病房',    title:'智慧電視｜逃生動線' },
  { file:'05', ch:'壹、智慧病房',    title:'智慧電視｜護理指導' },
  { file:'06', ch:'壹、智慧病房',    title:'緊急呼叫系統' },

  { file:'07', ch:'貳、智慧 PUMP',   title:'給藥安全' },
  { file:'08', ch:'貳、智慧 PUMP',   title:'監控與紀錄' },

  { file:'09', ch:'參、智慧床墊',    title:'連續監測' },
  { file:'10', ch:'參、智慧床墊',    title:'翻身照護' },

  { file:'11', ch:'肆、智慧手術室',  title:'UDI 追溯' },
  { file:'12', ch:'肆、智慧手術室',  title:'智慧盤點' },

  { file:'13', ch:'伍、智慧教學',    title:'AI VERTI 演練' },
  { file:'14', ch:'伍、智慧教學',    title:'AI VERTI 成效' },

  { file:'15', ch:'陸、智慧長照',    title:'預約與報到' },
  { file:'16', ch:'陸、智慧長照',    title:'家屬支持' },
  { file:'17', ch:'陸、智慧長照',    title:'消防模擬設定' },
  { file:'18', ch:'陸、智慧長照',    title:'消防推演學習' },
  { file:'19', ch:'陸、智慧長照',    title:'線上預假' },
  { file:'20', ch:'陸、智慧長照',    title:'自動排班' },
  { file:'21', ch:'陸、智慧長照',    title:'感染收案' },
  { file:'22', ch:'陸、智慧長照',    title:'感染監測報表' },
  { file:'23', ch:'陸、智慧長照',    title:'批號效期管理' },
  { file:'24', ch:'陸、智慧長照',    title:'快速盤點補貨' },

  { file:'25', ch:'',                title:'謝謝聆聽｜讓照護更有溫度' },

];

/* ═══════════════════════════════════════════════════════════════════
   ③ 以下不用改
   ═══════════════════════════════════════════════════════════════ */
const { createApp } = Vue;

createApp({
  data() {
    return {
      slides: SLIDES,
      i: 0,
      state: 'loading',   // loading | ok | error
      slow: false,
      baseIdx: 0,         // 路徑容錯：試過的 base 之一
      baseLocked: false,  // 有一張成功載入後就鎖定 base
      nonce: 0,
      ext: CONFIG.ext,
      barOn: true,
      grid: false,
      portrait: false,
      ignorePortrait: false,
      isFs: false,
      fsOK: !!(document.documentElement.requestFullscreen ||
               document.documentElement.webkitRequestFullscreen),
      curCell: null,
      _timer: null, _slow: null,
      _tx: 0, _ty: 0
    };
  },

  computed: {
    cur() { return this.slides[this.i] || { title: '', ch: '', file: '' }; },

    // 大多數情況第一個就對（一般相對路徑）。
    // 少數主機不給結尾斜線或把站台掛在根目錄，才會用到後面兩個。
    bases() {
      const p = location.pathname;
      return ['', p.replace(/\/?$/, '/'), '/'];
    },
    imgUrl() { return this.src(this.cur); },
    groups() {
      const out = [];
      this.slides.forEach((s, idx) => {
        const item = Object.assign({}, s, { idx });
        const last = out[out.length - 1];
        if (last && last.ch === s.ch) last.items.push(item);
        else out.push({ ch: s.ch, items: [item] });
      });
      return out;
    }
  },

  watch: {
    i(n) {
      this.beginLoad();
      history.replaceState(null, '', '#' + (n + 1));
      this.wake();
    },
    grid(on) {
      if (on) this.$nextTick(() => {
        if (this.curCell && this.curCell.scrollIntoView)
          this.curCell.scrollIntoView({ block: 'center' });
      });
    }
  },

  methods: {
    src(s) {
      const q = this.nonce ? '?r=' + this.nonce : '';
      return this.bases[this.baseIdx] + CONFIG.dir + s.file + CONFIG.ext + q;
    },
    thumb(s) {
      return this.bases[this.baseIdx] + CONFIG.dir + CONFIG.thumbPre + s.file + CONFIG.ext;
    },
    thumbFail(e, s) {
      // 沒有縮圖檔就退回用原圖
      if (e.target.dataset.fb) return;
      e.target.dataset.fb = '1';
      e.target.src = this.src(s);
    },

    beginLoad() {
      this.state = 'loading';
      this.slow = false;
      clearTimeout(this._slow);
      this._slow = setTimeout(() => { this.slow = true; }, 6000);
    },
    onLoad() {
      this.state = 'ok';
      this.slow = false;
      this.baseLocked = true;      // 這個 base 可用，之後不再換
      clearTimeout(this._slow);
      this.preload();              // 載完目前這張才去預抓下一張
    },
    onErr() {
      // 還沒確定過可用路徑的話，依序換下一個 base 再試
      if (!this.baseLocked && this.baseIdx < this.bases.length - 1) {
        this.baseIdx++;
        return;
      }
      clearTimeout(this._slow);
      this.state = 'error';
    },
    retry() {
      this.nonce = Date.now();
      this.beginLoad();
    },

    go(n)  { this.i = Math.min(Math.max(n, 0), this.slides.length - 1); },
    next() { if (this.i < this.slides.length - 1) this.i++; },
    prev() { if (this.i > 0) this.i--; },

    preload() {
      [this.i + 1, this.i + 2, this.i - 1].forEach(n => {
        if (n >= 0 && n < this.slides.length) {
          const im = new Image();
          im.src = this.src(this.slides[n]);
        }
      });
    },

    toggleBar() { this.barOn ? this.sleep() : this.wake(); },
    wake() {
      this.barOn = true;
      clearTimeout(this._timer);
      if (CONFIG.autoHideMs > 0)
        this._timer = setTimeout(() => { this.barOn = false; }, CONFIG.autoHideMs);
    },
    sleep() { clearTimeout(this._timer); this.barOn = false; },

    tStart(e) {
      if (e.touches.length !== 1) { this._tx = null; return; }
      this._tx = e.touches[0].clientX;
      this._ty = e.touches[0].clientY;
    },
    tEnd(e) {
      if (this._tx === null || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - this._tx;
      const dy = e.changedTouches[0].clientY - this._ty;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        dx < 0 ? this.next() : this.prev();
      }
      this._tx = null;
    },

    fullscreen() {
      const d = document, el = d.documentElement;
      if (d.fullscreenElement || d.webkitFullscreenElement) {
        (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    },

    onKey(e) {
      const k = e.key;
      if (k === 'Escape')                              { this.grid = false; return; }
      if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); this.next(); }
      else if (k === 'ArrowLeft' || k === 'PageUp')    { e.preventDefault(); this.prev(); }
      else if (k === 'Home')                           { this.go(0); }
      else if (k === 'End')                            { this.go(this.slides.length - 1); }
      else if (k === 'f' || k === 'F')                 { if (this.fsOK) this.fullscreen(); }
      else if (k === 'g' || k === 'G' || k === 't' || k === 'T') { this.grid = !this.grid; }
      this.wake();
    },

    checkOrient() {
      this.portrait = window.matchMedia('(orientation: portrait)').matches
                      && window.innerWidth < 900;
    }
  },

  mounted() {
    document.title = document.title; // 標題改這裡上方的 <title> 即可

    const n = parseInt((location.hash || '').replace('#', ''), 10);
    if (n >= 1 && n <= this.slides.length) this.i = n - 1;

    this.beginLoad();
    this.checkOrient();
    this.wake();

    window.addEventListener('keydown', this.onKey);
    window.addEventListener('resize', this.checkOrient);
    window.addEventListener('orientationchange', this.checkOrient);
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
      document.addEventListener(ev, () => {
        this.isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      })
    );
  }
}).mount('#app');
</script>
</body>
</html>
